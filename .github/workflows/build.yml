name: Build Custom AyuGram (Linux x86_64)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Standalone Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore Workspace Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            out
          key: build-cache-linux-${{ github.run_id }}
          restore-keys: |
            build-cache-linux-
            ccache-linux-

      - name: Restore Git Timestamps
        run: |
          python3 -c '
          import subprocess, os
          out = subprocess.check_output(["git", "log", "--name-only", "--pretty=format:%ct"]).decode("utf-8")
          cur_time = None
          seen = set()
          for line in out.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.isdigit():
                  cur_time = int(line)
              elif cur_time and line not in seen:
                  seen.add(line)
                  if os.path.exists(line):
                      try:
                          os.utime(line, (cur_time, cur_time))
                      except Exception:
                          pass
          ' || true

      - name: Patch Build Dependencies
        run: |
          cat << 'STUB_EOF' > cmake/external/cld3/CMakeLists.txt
          add_library(external_cld3 INTERFACE IMPORTED GLOBAL)
          add_library(desktop-app::external_cld3 ALIAS external_cld3)
          STUB_EOF

          cat << 'SPELL_EOF' > Telegram/lib_spellcheck/spellcheck/third_party/language_cld3.cpp
          #include "spellcheck/third_party/language_cld3.h"

          namespace Platform::Language {

          LanguageId Recognize(QStringView text) {
              return {};
          }

          } // namespace Platform::Language
          SPELL_EOF

          sed -i 's/PROPERTIES FOLDER "(external)"/PROPERTIES FOLDER "(external)" UNITY_BUILD OFF/' cmake/external/cmark_gfm/CMakeLists.txt

      - name: Pull build container
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest

      - name: Build AyuGram Binary
        run: |
          mkdir -p .ccache out
          docker run --rm \
            -u $(id -u) \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -e HOME=/usr/src/tdesktop \
            -e CCACHE_DISABLE=0 \
            -e CCACHE_DIR=/usr/src/tdesktop/.ccache \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_DIRECT=1 \
            -e CCACHE_DEPEND=1 \
            -e CCACHE_MAXSIZE=8G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime,file_macro,line_macro,modules,locale \
            -e CCACHE_COMPILERCHECK=none \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DDESKTOP_APP_DISABLE_QT_PLUGINS=ON \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -DTDESKTOP_DISABLE_AUTOUPDATE=ON \
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Save Workspace Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            out
          key: build-cache-linux-${{ github.run_id }}

      - name: Strip & Package Binary
        run: |
          cd out/Release
          strip -s AyuGram || true
          tar -cJf AyuGram-Linux-Custom.tar.xz AyuGram
          ls -lh AyuGram-Linux-Custom.tar.xz

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Custom
          path: out/Release/AyuGram-Linux-Custom.tar.xz
          retention-days: 30

      - name: Extract Version Info
        id: version
        run: |
          VERSION=$(grep -oP 'AppVersionStr = "\K[^"]+' Telegram/SourceFiles/core/version.h || echo "7.0.9-custom-b3")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "title=AyuGram Desktop v${VERSION} (Custom Linux Edition)" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body_path: CHANGELOG.md
          files: out/Release/AyuGram-Linux-Custom.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
