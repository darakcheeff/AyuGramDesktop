name: Build Custom AyuGram (Linux x86_64)

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Clean build (ignore existing checkpoint cache)'
        required: false
        default: false
        type: boolean
      migrate_cache_only:
        description: 'Only migrate legacy Actions cache to GitHub Release checkpoint (skip build)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build-linux:
    name: Build Standalone Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore Release Checkpoint
        if: success() && inputs.clean_cache != true && inputs.clean_cache != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          command -v zstd >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zstd)
          CHECKPOINT_TAG="build-cache-linux"
          if gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Found release checkpoint $CHECKPOINT_TAG. Downloading cache parts..."
            mkdir -p /tmp/checkpoint
            gh release download "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --pattern "cache-linux-x64.tar.zst.part_*" --dir /tmp/checkpoint || true
            if compgen -G "/tmp/checkpoint/cache-linux-x64.tar.zst.part_*" > /dev/null; then
              echo "Extracting release checkpoint into $GITHUB_WORKSPACE..."
              cat /tmp/checkpoint/cache-linux-x64.tar.zst.part_* | tar -I "zstd -d -T0" -xf - -C "$GITHUB_WORKSPACE"
              rm -rf /tmp/checkpoint
              echo "RELEASE_CACHE_RESTORED=true" >> "$GITHUB_ENV"
              echo "Release checkpoint restored successfully."
            else
              rm -rf /tmp/checkpoint
              echo "No checkpoint archive parts found in $CHECKPOINT_TAG."
            fi
          else
            echo "No release checkpoint $CHECKPOINT_TAG found yet."
          fi

      - name: Fallback Restore from Legacy Actions Cache
        if: success() && (inputs.clean_cache != true && inputs.clean_cache != 'true') && env.RELEASE_CACHE_RESTORED != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            out
          key: build-cache-linux-${{ github.run_id }}
          restore-keys: |
            build-cache-linux-
            ccache-linux-

      - name: Restore Git Timestamps
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        run: |
          python3 -c '
          import subprocess, os
          out = subprocess.check_output(["git", "log", "--name-only", "--pretty=format:%ct"]).decode("utf-8")
          cur_time = None
          seen = set()
          for line in out.splitlines():
              line = line.strip()
              if not line:
                  continue
              if line.isdigit():
                  cur_time = int(line)
              elif cur_time and line not in seen:
                  seen.add(line)
                  if os.path.exists(line):
                      try:
                          os.utime(line, (cur_time, cur_time))
                      except Exception:
                          pass
          ' || true

      - name: Patch Build Dependencies
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        run: |
          cat << 'STUB_EOF' > cmake/external/cld3/CMakeLists.txt
          add_library(external_cld3 INTERFACE IMPORTED GLOBAL)
          add_library(desktop-app::external_cld3 ALIAS external_cld3)
          STUB_EOF

          cat << 'SPELL_EOF' > Telegram/lib_spellcheck/spellcheck/third_party/language_cld3.cpp
          #include "spellcheck/third_party/language_cld3.h"

          namespace Platform::Language {

          LanguageId Recognize(QStringView text) {
              return {};
          }

          } // namespace Platform::Language
          SPELL_EOF

          sed -i 's/PROPERTIES FOLDER "(external)"/PROPERTIES FOLDER "(external)" UNITY_BUILD OFF/' cmake/external/cmark_gfm/CMakeLists.txt

      - name: Pull build container
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest

      - name: Build AyuGram Binary
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        run: |
          mkdir -p .ccache out
          docker run --rm \
            -u $(id -u) \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -e HOME=/usr/src/tdesktop \
            -e CC=gcc \
            -e CXX=g++ \
            -e CCACHE_DIR=/usr/src/tdesktop/.ccache \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_DIRECT=1 \
            -e CCACHE_DEPEND=1 \
            -e CCACHE_MAXSIZE=8G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime,file_macro,line_macro,modules,locale \
            -e CCACHE_COMPILERCHECK=none \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DDESKTOP_APP_DISABLE_QT_PLUGINS=ON \
            -DTDESKTOP_API_ID=2040 \
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -DTDESKTOP_DISABLE_AUTOUPDATE=ON \
            -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Strip & Package Binary
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        run: |
          cd out/Release
          strip -s AyuGram || true
          tar -cJf AyuGram-Linux-Custom.tar.xz AyuGram
          ls -lh AyuGram-Linux-Custom.tar.xz

      - name: Upload Build Artifact
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Custom
          path: out/Release/AyuGram-Linux-Custom.tar.xz
          retention-days: 30

      - name: Extract Version Info
        id: version
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        run: |
          VERSION=$(grep -oP 'AppVersionStr = "\K[^"]+' Telegram/SourceFiles/core/version.h || echo "7.0.9")
          BUILD_INFO=$(grep -oP 'AppBuildInfoStr = "\K[^"]+' Telegram/SourceFiles/core/version.h || echo "")
          if [ -n "$BUILD_INFO" ]; then
            FULL_VERSION="${VERSION}-${BUILD_INFO}"
          else
            FULL_VERSION="${VERSION}"
          fi
          echo "tag=v${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "title=AyuGram Desktop v${FULL_VERSION} (Custom Linux Edition)" >> $GITHUB_OUTPUT

      - name: Create / Update GitHub Release
        if: success() && inputs.migrate_cache_only != true && inputs.migrate_cache_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.title }}
          body_path: CHANGELOG.md
          files: out/Release/AyuGram-Linux-Custom.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Release Checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          command -v zstd >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y zstd)
          PATHS_TO_SAVE=""
          [ -d ".ccache" ] && PATHS_TO_SAVE="$PATHS_TO_SAVE .ccache"
          [ -d "out" ] && PATHS_TO_SAVE="$PATHS_TO_SAVE out"
          if [ -z "$PATHS_TO_SAVE" ]; then
            echo "Nothing to save."
            exit 0
          fi

          PARTS_DIR="/tmp/checkpoint_out"
          rm -rf "$PARTS_DIR"
          mkdir -p "$PARTS_DIR"
          echo "Archiving$PATHS_TO_SAVE into split zstd parts..."
          tar --exclude='out/Release/AyuGram-Linux-Custom.tar.xz' -cf - $PATHS_TO_SAVE | zstd -1 -T0 | split -b 1900M -d -a 2 - "$PARTS_DIR/cache-linux-x64.tar.zst.part_"
          ls -lh "$PARTS_DIR"

          CHECKPOINT_TAG="build-cache-linux"
          gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Linux Build Cache Checkpoint" \
              --notes "Permanent build cache checkpoint (.ccache + out) for AyuGram Desktop." \
              --prerelease

          for part in "$PARTS_DIR"/cache-linux-x64.tar.zst.part_*; do
            [ -f "$part" ] || continue
            uploaded=false
            for attempt in 1 2 3; do
              echo "Uploading $(basename "$part") (attempt $attempt of 3)..."
              if gh release upload "$CHECKPOINT_TAG" "$part" --repo "$GITHUB_REPOSITORY" --clobber; then
                echo "Uploaded $(basename "$part") successfully."
                uploaded=true
                break
              fi
              echo "Upload attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
            if [ "$uploaded" != "true" ]; then
              echo "Failed to upload $(basename "$part") after 3 attempts."
              rm -rf "$PARTS_DIR"
              exit 1
            fi
          done

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CHECKPOINT_TAG" --jq '.assets[] | "\(.id) \(.name)"' | while read -r asset_id asset_name; do
            case "$asset_name" in
              cache-linux-x64.tar.zst.part_*)
                if [ ! -f "$PARTS_DIR/$asset_name" ]; then
                  echo "Deleting stale checkpoint asset: $asset_name (id=$asset_id)"
                  gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" || true
                fi
                ;;
            esac
          done

          rm -rf "$PARTS_DIR"
          echo "Release checkpoint saved successfully."
