name: Build Custom AyuGram (Linux x86_64)

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Standalone Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Workspace Cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            out
          key: build-cache-linux-${{ github.run_id }}
          restore-keys: |
            build-cache-linux-

      - name: Patch Unused CLD3 Dependencies
        run: |
          cat << 'STUB_EOF' > cmake/external/cld3/CMakeLists.txt
          add_library(external_cld3 INTERFACE IMPORTED GLOBAL)
          add_library(desktop-app::external_cld3 ALIAS external_cld3)
          STUB_EOF

          cat << 'SPELL_EOF' > Telegram/lib_spellcheck/spellcheck/third_party/language_cld3.cpp
          #include "spellcheck/third_party/language_cld3.h"

          namespace Platform::Language {

          LanguageId Recognize(QStringView text) {
              return {};
          }

          } // namespace Platform::Language
          SPELL_EOF

      - name: Pull build container
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env:latest

      - name: Build AyuGram Binary
        run: |
          mkdir -p .ccache
          docker run --rm \
            -u $(id -u) \
            -v "$GITHUB_WORKSPACE:/usr/src/tdesktop" \
            -e CCACHE_DIR=/usr/src/tdesktop/.ccache \
            -e CCACHE_BASEDIR=/usr/src/tdesktop \
            -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_MAXSIZE=10G \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime \
            -e CCACHE_COMPILERCHECK=content \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_C_COMPILER_LAUNCHER=ccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -D TDESKTOP_API_ID=2040 \
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 \
            -D TDESKTOP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Strip & Package Binary
        run: |
          cd out/Release
          strip -s AyuGram || true
          tar -cJf AyuGram-Linux-Custom.tar.xz AyuGram
          ls -lh AyuGram-Linux-Custom.tar.xz

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Linux-Custom
          path: out/Release/AyuGram-Linux-Custom.tar.xz
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-linux-v7.0.9
          name: Custom AyuGram Linux Release
          body: |
            ### Custom AyuGram Linux Release
            - **Base**: AyuGram v7.0.9 (Latest MTProto layer support)
            - **Features**:
              - Tree/replies navigation for all chats
              - RegEx and morphology (RU/EN) stemming search
              - Active folder search filter
              - Responsive / Wide chat post layout
              - Fixed Issue #454 (Topic deleted message preservation)
              - Fixed Issue #424 (Self-deleted message preservation)
              - System default browser enforced (no embedded webview)
              - Stories completely disabled
              - Gifts, TON/Crypto, Stars completely disabled
              - Remote pings & telemetry (RCManager, dpaste, iTunes, Sentry) completely neutralized
            - **Artifact**: `AyuGram-Linux-Custom.tar.xz` (Standalone portable binary)
          files: out/Release/AyuGram-Linux-Custom.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
